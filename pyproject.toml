[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rfid-demod"
version = "0.1.0"
description = "Software demodulator for RFID IQ captures (LF / HF / UHF)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
rfid-demod = "rfid_demod.cli:main"

[tool.setuptools.packages.find]
include = ["rfid_demod*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
